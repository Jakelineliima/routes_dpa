<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./favicon.png" type="image/png">
  <title>Preenchimento de Rotas</title>
</head>

<body>
  <div class="container_divs">
    <div class="container">
      <div class="header">
        <h1>
          <span>✈️</span>
          Automação de Rotas
          <span>✈️</span>
        </h1>
        <p>Preencha formulários automaticamente</p>
      </div>

      <div class="form-group">
        <label for="dados">📋 Cole suas rotas aqui:</label>
        <textarea id="dados" placeholder="Exemplo:
GRU CGH
SAO RIO
BSB POA

Separe origem e destino por espaço ou tab"></textarea>
      </div>

      <!-- Cards de status — IDs únicos, sem conflito com #relatorio -->
      <div class="stats" id="json-preview">
        <div class="stat-card">
          <div class="number" id="preview-icone">⚠️</div>
          <div class="label" id="preview-label">Rotas</div>
        </div>
        <div class="stat-card">
          <div class="number" id="preview-total">0</div>
          <div class="label" id="preview-label-validas">Válidas</div>
        </div>
        <div class="stat-card" id="aviso-limite" style="display:none;">
          <span class="number">⚠️</span>
          <span class="label" id="aviso-texto"></span>
        </div>


      </div>

      <button id="btnExecutar">
        <span>Executar Automação test</span>
      </button>
      <button id="btnParar" disabled>
        <span>Parar Automação</span>
      </button>
    </div>


    <!-- Relatório final — id único -->
    <div id="relatorio" style="display:none;">

      <div class="header_relatorio">

        <h1>
          <span>✈️</span>
          Relatorio Final
          <span>✈️</span>
        </h1>

        <h3 id="relatorio-titulo"></h3>

        <div id="relatorio-interrupcao" style="display:none;">
          <p>⚠️ Processo interrompido pelo usuário</p>
        </div>

        <div id="relatorio-processadas">
          <p id="relatorio-processadas-texto"></p>
        </div>

        <div id="relatorio-nao-encontradas" style="display:none;">
          <p id="relatorio-nao-encontradas-titulo"></p>
          <div id="relatorio-nao-encontradas-lista"></div>
        </div>
        <hr class="separador">
        <!-- Seção JSON -->
        <div id="json-section" style="display: none;" >
          <div >
            <label style="font-size:13px;">🗂️ JSON gerado</label>
            <button id="btnCopiarJSON">Copiar</button>
          </div>
          <textarea id="json-output" readonly rows="6"></textarea>
        </div>
      </div>
    </div>

    <div id="  "></div>

  </div>

  <script src="popup.js"></script>
</body>

</html>
